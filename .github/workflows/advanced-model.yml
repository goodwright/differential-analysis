name: Advanced model tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  synthetic-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
          use-public-rspm: true
      - name: Install statistical dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("jsonlite", "statmod", "locfit", "Rcpp"))
          install.packages("https://bioconductor.org/packages/3.19/bioc/src/contrib/limma_3.60.6.tar.gz", repos=NULL, type="source")
          install.packages("https://bioconductor.org/packages/3.19/bioc/src/contrib/edgeR_4.2.2.tar.gz", repos=NULL, type="source")
      - name: Statistical tests on synthetic counts
        run: Rscript tests/advanced_model/test_advanced.R "$PWD" "$RUNNER_TEMP/advanced-fixture"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas==2.3.3 setuptools==80.9.0 pyyaml==6.0.2
      - uses: nf-core/setup-nextflow@v1
        with:
          version: "24.10.8"
      - name: End-to-end advanced workflow
        run: |
          nextflow run main.nf \
            --analysis_mode design_contrasts \
            --samplesheet "$RUNNER_TEMP/advanced-fixture/samples.csv" \
            --counts "$RUNNER_TEMP/advanced-fixture/counts.tsv" \
            --design_formula '~ 0 + pair + poly + poly:ko1 + poly:ko9' \
            --numeric_covariates poly,ko1,ko9 \
            --contrast_table "$RUNNER_TEMP/advanced-fixture/contrasts.csv" \
            --gene_sets "$RUNNER_TEMP/advanced-fixture/modules.gmt" \
            --gene_universe "$RUNNER_TEMP/advanced-fixture/universe.txt" \
            --filter_column fraction --filter_level input \
            --study_name synthetic_interaction --outdir "$RUNNER_TEMP/advanced-output" \
            --publish_dir_mode copy --max_memory 4.GB --max_cpus 2
          diff "$RUNNER_TEMP/advanced-fixture/result/camera.results.tsv" "$RUNNER_TEMP/advanced-output/synthetic_interaction/custom_model/camera.results.tsv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advanced-model-test-evidence
          path: |
            ${{ runner.temp }}/advanced-fixture/test-summary.json
            ${{ runner.temp }}/advanced-output/**/model_audit.json
            ${{ runner.temp }}/advanced-output/**/software_versions.yml
            .nextflow.log
